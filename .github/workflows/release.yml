name: Release

# Every push to main ships a release. The version is the latest v* tag plus one patch.
# Put [minor] or [major] in the PR title for a bigger bump, or [skip release] to ship nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      versionName:
        description: Version to build (dry run, nothing is published)
        default: 0.0.1

# one release at a time, so each run sees the tag of the one before
concurrency:
  group: release
  cancel-in-progress: false

env:
  # SHA-256 of the release signing certificate. This is public, not a secret.
  EXPECTED_CERT_SHA256: 7c41896869e8c6c2bbb0a86f9fbd514797e58de74d4d6eb0438506bf3656a512

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    env:
      EVENT: ${{ github.event_name }}
      MESSAGE: ${{ github.event.head_commit.message }}
      INPUT_VERSION: ${{ inputs.versionName }}
    steps:
      - name: Work out the version
        id: next
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="v$INPUT_VERSION"
          else
            title=$(printf '%s\n' "$MESSAGE" | head -n 1)
            case "$title" in
              *"[skip release]"*)
                echo "Skipped by [skip release]"
                exit 0
                ;;
            esac
            latest=$(git ls-remote --tags --refs "https://github.com/$GITHUB_REPOSITORY" 'v*' \
              | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            if [ -z "$latest" ]; then
              tag="v0.1.0"
            else
              IFS=. read -r major minor patch <<< "${latest#v}"
              case "$title" in
                *"[major]"*) major=$((major + 1)); minor=0; patch=0 ;;
                *"[minor]"*) minor=$((minor + 1)); patch=0 ;;
                *) patch=$((patch + 1)) ;;
              esac
              # versionCode allows at most 99 for minor and patch
              if [ "$patch" -gt 99 ]; then minor=$((minor + 1)); patch=0; fi
              if [ "$minor" -gt 99 ]; then major=$((major + 1)); minor=0; fi
              tag="v$major.$minor.$patch"
            fi
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Bad version, expected vX.Y.Z"
            exit 1
          fi
          echo "Version $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Decode the keystore
        env:
          KEYSTORE_B64: ${{ secrets.WICK_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/wick-release.jks"
          echo "WICK_KEYSTORE_PATH=$RUNNER_TEMP/wick-release.jks" >> "$GITHUB_ENV"

      - name: Build the release APK
        env:
          WICK_KEYSTORE_PASSWORD: ${{ secrets.WICK_KEYSTORE_PASSWORD }}
          WICK_KEY_ALIAS: ${{ secrets.WICK_KEY_ALIAS }}
          WICK_KEY_PASSWORD: ${{ secrets.WICK_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PversionName="${TAG#v}"

      - name: Check the signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "No signed APK was produced. Are the signing secrets set?"
            exit 1
          fi
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          cp "$apk" "wick-$TAG.apk"
          "$apksigner" verify --print-certs "wick-$TAG.apk" | tee certs.txt
          # apksigner prints "Signer #1" or "V2 Signer" depending on the schemes, so every signer must match
          actual=$(sed -n 's/^.*[Ss]igner.* certificate SHA-256 digest: //p' certs.txt | tr 'A-F' 'a-f' | sort -u)
          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "The APK is not signed with the expected release key."
            exit 1
          fi

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/wick-release.jks"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wick-${{ env.TAG }}
          path: wick-${{ env.TAG }}.apk

  publish:
    if: github.event_name == 'push'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wick-${{ env.TAG }}
          path: dist

      # creates the tag on the commit that was built
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          body: Install or update with Obtainium.
          generate_release_notes: true
          files: dist/wick-${{ env.TAG }}.apk
